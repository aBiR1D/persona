[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persona-market"
version = "0.1.0"
description = "Clone your expertise into an AI persona and sell access — like Cameo for knowledge."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anthropic>=0.30",
    "openai>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "mcp[cli]>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
persona = "persona.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["persona"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
